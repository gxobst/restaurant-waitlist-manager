openapi: 3.1.0
info:
  title: Restaurant Waitlist Manager API
  description: Backend API that the React/Vite frontend consumes. All timestamps are ISO 8601 strings. IDs are UUIDs.
  version: 1.0.0
servers:
  - url: http://localhost:5173
    description: Default local backend (configured via VITE_API_BASE_URL)

paths:
  /api/waitlist:
    get:
      summary: List all waitlist entries
      tags: [Waitlist]
      security: []
      responses:
        "200":
          description: A list of waitlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WaitlistEntry"
    post:
      summary: Add a new party to the waitlist
      tags: [Waitlist]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartyRequest"
      responses:
        "200":
          description: The created party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "422":
          description: Validation error

  /api/waitlist/{id}:
    patch:
      summary: Update a party (status, urgent flag, notes, etc.)
      tags: [Waitlist]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePartyRequest"
      responses:
        "200":
          description: The updated party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "404":
          description: Party not found
        "409":
          description: Invalid status transition
    delete:
      summary: Remove a party from the waitlist
      tags: [Waitlist]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Party deleted
        "404":
          description: Party not found

  /api/waitlist/{id}/undo:
    post:
      summary: Undo the last action on a party
      tags: [Waitlist]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The party after undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "404":
          description: Party not found
        "409":
          description: No action to undo

  /api/waitlist/token/{token}:
    get:
      summary: Get a party by guest token (for the guest status page)
      tags: [Waitlist — Guest]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The party associated with the token, or null if not found
          content:
            application/json:
              schema:
                nullable: true
                oneOf:
                  - $ref: "#/components/schemas/WaitlistEntry"
                  - type: "null"
        "404":
          description: Token not found (returns null body)

  /api/waitlist/token/{token}/confirm:
    post:
      summary: Guest confirms they are still waiting (resets no-show timer)
      tags: [Waitlist — Guest]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The updated party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "404":
          description: Token not found

  /api/waitlist/token/{token}/cancel:
    post:
      summary: Guest cancels themselves from the waitlist
      tags: [Waitlist — Guest]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The updated (canceled) party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "404":
          description: Token not found

  /api/tables:
    get:
      summary: List all tables
      tags: [Tables]
      security: []
      responses:
        "200":
          description: A list of tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
    post:
      summary: Create a new table (manager only)
      tags: [Tables]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTableRequest"
      responses:
        "200":
          description: The created table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"

  /api/tables/{id}:
    patch:
      summary: Update a table (occupy/clear, change capacity or label)
      tags: [Tables]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTableRequest"
      responses:
        "200":
          description: The updated table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "404":
          description: Table not found
    delete:
      summary: Delete a table (manager only)
      tags: [Tables]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Table deleted
        "404":
          description: Table not found

  /api/reports/daily:
    get:
      summary: Get today's daily report statistics
      tags: [Reports]
      security: []
      responses:
        "200":
          description: Daily report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReportResponse"

  /api/settings/pin:
    post:
      summary: Verify a manager PIN
      tags: [Settings]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinVerifyRequest"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                required: [valid]
        "401":
          description: Invalid PIN
    patch:
      summary: Change the manager PIN
      tags: [Settings]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinChangeRequest"
      responses:
        "204":
          description: PIN changed successfully
        "401":
          description: Current PIN is incorrect

  /api/settings/avg-turnover-time:
    get:
      summary: Get the average table turnover time in minutes
      tags: [Settings]
      security: []
      responses:
        "200":
          description: The current average turnover time in minutes
          content:
            application/json:
              schema:
                type: number
                minimum: 1
    patch:
      summary: Set the average table turnover time in minutes
      tags: [Settings]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes:
                  type: number
                  minimum: 1
                  maximum: 120
      responses:
        "204":
          description: Turnover time updated
        "422":
          description: Minutes out of valid range

  /api/settings/waitlist-paused:
    get:
      summary: Get the current waitlist pause state
      tags: [Settings]
      security: []
      responses:
        "200":
          description: Whether the waitlist is currently paused
          content:
            application/json:
              schema:
                type: boolean
    patch:
      summary: Set the waitlist pause state
      tags: [Settings]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused:
                  type: boolean
      responses:
        "204":
          description: Pause state updated

components:
  schemas:
    PartyStatus:
      type: string
      enum: [waiting, notified, seated, canceled, no_show]

    WaitlistEntry:
      allOf:
        - $ref: "#/components/schemas/Party"

    Party:
      type: object
      required: [id, name, party_size, status, created_at, updated_at]
      properties:
        id:
          type: string
          description: UUID
        name:
          type: string
        party_size:
          type: integer
          minimum: 1
          maximum: 12
        phone:
          type: [string, "null"]
          nullable: true
        email:
          type: [string, "null"]
          nullable: true
        status:
          $ref: "#/components/schemas/PartyStatus"
        position:
          type: [integer, "null"]
          nullable: true
          description: Position in the waitlist (null before first fetch)
        estimated_wait:
          type: [integer, "null"]
          nullable: true
          description: Estimated wait time in minutes
        notes:
          type: [string, "null"]
          nullable: true
        urgent:
          type: boolean
        token:
          type: [string, "null"]
          nullable: true
          description: NanoID token for the guest status link
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        notified_at:
          type: [string, "null"]
          nullable: true
        seated_at:
          type: [string, "null"]
          nullable: true
        canceled_at:
          type: [string, "null"]
          nullable: true

    CreatePartyRequest:
      type: object
      required: [name, party_size]
      properties:
        name:
          type: string
          minLength: 1
        party_size:
          type: integer
          minimum: 1
          maximum: 12
        phone:
          type: [string, "null"]
          nullable: true
        email:
          type: [string, "null"]
          nullable: true
        notes:
          type: [string, "null"]
          nullable: true
        urgent:
          type: boolean
          default: false

    UpdatePartyRequest:
      type: object
      properties:
        name:
          type: string
        party_size:
          type: integer
          minimum: 1
          maximum: 12
        phone:
          type: [string, "null"]
          nullable: true
        email:
          type: [string, "null"]
          nullable: true
        status:
          $ref: "#/components/schemas/PartyStatus"
        position:
          type: [integer, "null"]
          nullable: true
        estimated_wait:
          type: [integer, "null"]
          nullable: true
        notes:
          type: [string, "null"]
          nullable: true
        urgent:
          type: boolean

    Table:
      type: object
      required: [id, capacity, label, is_occupied, created_at]
      properties:
        id:
          type: string
          description: UUID
        capacity:
          type: integer
          minimum: 1
          maximum: 20
        label:
          type: string
        is_occupied:
          type: boolean
        occupied_by_party_id:
          type: [string, "null"]
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateTableRequest:
      type: object
      required: [capacity, label]
      properties:
        capacity:
          type: integer
          minimum: 1
          maximum: 20
        label:
          type: string
          minLength: 1

    UpdateTableRequest:
      type: object
      properties:
        capacity:
          type: integer
          minimum: 1
          maximum: 20
        label:
          type: string
        is_occupied:
          type: boolean
        occupied_by_party_id:
          type: [string, "null"]
          nullable: true

    DailyReportResponse:
      type: object
      required: [date, total_parties, average_wait_minutes, no_show_rate, seat_utilization]
      properties:
        date:
          type: string
          format: date
        total_parties:
          type: integer
          minimum: 0
        average_wait_minutes:
          type: number
          minimum: 0
        no_show_rate:
          type: number
          minimum: 0
          maximum: 1
          description: Ratio as a decimal (e.g. 0.15 = 15%)
        seat_utilization:
          type: number
          minimum: 0
          maximum: 1
          description: Ratio of occupied tables to total tables

    PinVerifyRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: "^\\d{4,8}$"

    PinChangeRequest:
      type: object
      required: [current_pin, new_pin]
      properties:
        current_pin:
          type: string
          pattern: "^\\d{4,8}$"
        new_pin:
          type: string
          pattern: "^\\d{4,8}$"

  securitySchemes:
    # No auth schemes defined — the frontend passes no auth headers.
    # Manager operations are gated client-side by the PIN modal;
    # the backend does not require bearer tokens for any endpoint.
    {}

security: []
